name: Skill linter

on:
  pull_request:
    paths:
      - '**/SKILL.md'
      - 'hooks/*.md'
      - 'scripts/**/*.mjs'
      - 'scripts/fixtures/**'
      - 'skills-catalog.yaml'
      - '.claude-plugin/marketplace.json'
      - '**/.claude-plugin/plugin.json'
      - '.agents/plugins/**'
      - '**/.codex-plugin/**'
      - '**/agents/openai.yaml'
      - 'pdf-playground/brands/**'
      - 'pdf-playground/controls/**'
      - 'pdf-playground/templates/**'
      - 'pdf-playground/README.md'
      - 'pdf-playground/skills/document-design/brands/**'
      - 'pdf-playground/skills/document-design/controls/**'
      - 'pdf-playground/skills/document-design/templates/**'
      - 'README.md'
      - 'docs/index.html'
      - 'docs/superjawn/index.html'
      - 'docs/skill-behavior-evaluations.md'
      - 'superjawn/README.md'
      - 'superjawn/CREDITS.md'
      - 'plans/codex-compatibility-matrix.md'
      - 'plans/2026-08-28-video-toolkit-codex-preflight.md'
      - 'plans/2026-09-03-document-design-codex-runtime-pilot.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/compatibility-canary.yml'
      - '.github/workflows/skill-lint.yml'

permissions:
  contents: read

jobs:
  lint-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: npm ci

      - name: Validate repository catalog
        run: npm run validate:catalog

      - name: Validate Agent Skills metadata
        run: npm run validate:agent-skills

      - name: Validate hook frontmatter
        run: |
          errors=0

          # Check hook files.
          for hook_file in hooks/*.md; do
            [ -f "$hook_file" ] || continue

            if ! head -1 "$hook_file" | grep -q '^---$'; then
              echo "ERROR: $hook_file - missing YAML frontmatter"
              errors=$((errors + 1))
              continue
            fi

            frontmatter=$(sed -n '/^---$/,/^---$/p' "$hook_file" | sed '1d;$d')

            if ! echo "$frontmatter" | grep -q '^name:'; then
              echo "ERROR: $hook_file - missing 'name' in frontmatter"
              errors=$((errors + 1))
            fi

            if ! echo "$frontmatter" | grep -q -E '^(event|events):'; then
              echo "ERROR: $hook_file - missing 'event' in frontmatter"
              errors=$((errors + 1))
            fi

            echo "OK: $hook_file"
          done

          if [ $errors -gt 0 ]; then
            echo ""
            echo "Found $errors error(s)"
            exit 1
          fi

          echo ""
          echo "All hooks validated"

  check-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check new skills are listed in README
        run: |
          warnings=0

          for skill_dir in */; do
            skill_name="${skill_dir%/}"

            # Skip non-skill directories
            case "$skill_name" in
              hooks|docs|node_modules|.github|.claude-plugin|pdf-playground|autocontext) continue ;;
            esac

            [ -f "$skill_dir/SKILL.md" ] || continue

            if ! grep -q "\[$skill_name\]" README.md; then
              echo "WARNING: $skill_name is not listed in README.md"
              warnings=$((warnings + 1))
            fi
          done

          if [ $warnings -gt 0 ]; then
            echo ""
            echo "$warnings skill(s) missing from README.md"
            echo "Please add them to the appropriate section"
            exit 1
          fi

          echo "All skills listed in README.md"

  security-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
