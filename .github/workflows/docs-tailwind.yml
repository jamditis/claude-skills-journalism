name: Docs Tailwind build

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/docs-tailwind.mjs'
      - 'scripts/docs-tailwind-security.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs-tailwind.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-docs-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:docs-css
