name: Security toolkit secret-scan self-test

on:
  pull_request:
    branches: [master]
    paths:
      - 'security-toolkit/skills/private-secret-scanning/**'
      - '.github/workflows/security-toolkit-secret-scan-selftest.yml'

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned Gitleaks
        run: bash security-toolkit/skills/private-secret-scanning/scripts/secret-scan.sh install

      - name: Run secret-scan self-test
        run: bash security-toolkit/skills/private-secret-scanning/scripts/secret-scan.sh self-test
